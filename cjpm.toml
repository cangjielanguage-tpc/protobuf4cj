[dependencies]

[workspace] # workspace形式: 负责dynamic构建protobuf和google; 整库git依赖时cjpm按依赖名在members中搜索模块
  members = ["src/protobuf","src/google"] # 工作空间成员模块列表，必需
  compile-option = ""
  override-compile-option = "-O2 --int-overflow=wrapping"
  link-option = ""
  target-dir = ""

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff unused --error-count-limit all "
    release = "--fast-math -O2 -Woff all"
  [profile.test]
