syntax="proto3";
package foo;

message Title {
    oneof data {
        Title1 title1 = 1;
        Title2 title2 = 2;
        Title3 title3 = 3;
    }
}

message Title1 {
    string name = 1;
    string version = 2;
}

message Title2 {
    string author = 1;
    string category = 2;
}

message Title3 {
    uint32 pages = 1;
    string date = 2;
    string property = 3;
}
