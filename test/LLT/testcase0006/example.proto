syntax = "proto2";
package foo;

message ValueTypes {
    required fixed32 d1 = 1;
    optional sfixed32 d2 = 2;
    required fixed64 d3 = 3;
    required sfixed64 d4 = 4;
    required int32 d5 = 5;
    required sint32 d6 = 6;
    required uint32 d7 = 7;
    required int64 d8 = 8;
    required sint64 d9 = 9;
    required uint64 d10 = 10;
    required double d11 = 11;
    required bool flag = 12;
    required bytes b1 = 13;
    required float f1 = 14;
    required string s1 = 15;
}
