syntax = "proto3";
package grouptest;

// 复杂结构组合测试

message Person {
	//Teacher teacher = 1;
	//Student student = 2;
	//Gender g = 3;
	//Subject sub = 4;
	
	message Teacher {
		string name = 1;
		int32 age = 2;
		Gender gender = 3;
		Subject subject = 4;
	}

	message Student {
		string name = 1;
		int32 age = 2;
		Gender gender = 3;
		repeated TestRecord records = 4;
		
		message TestRecord {
			Subject subject = 1;
			int32 score = 2;
		}
	}
	
	enum Gender {
		MAN = 0;
		FEMALE = 1;
	}

	enum Subject {
		LANGUAGE = 0;
		MATH = 1;
		HISTORY = 2;
	}
}

	
message School {
	map<int32, string> className = 1;
	repeated Person.Teacher teacherArray = 2;
	repeated Person.Student studentArray = 3;
	
	oneof test_oneof {
		string id = 5;
		string number = 6;
		string nikename = 7;
	}
}