syntax = "proto3";
package maptest;

// 复杂结构组合测试
message Person {

	message Teacher {
		string name = 1;
		int32 age = 2;
		Gender gender = 3;
		Subject subject = 4;
	}

	message Student {
		string name = 1;
		int32 age = 2;
		Gender gender = 3;
		repeated TestRecord records = 4;
		
		message TestRecord {
			Subject subject = 1;
			int32 score = 2;
		}
	}
	
	enum Gender {
		MAN = 0;
		FEMALE = 1;
	}

	enum Subject {
		LANGUAGE = 0;
		MATH = 1;
		HISTORY = 2;
	}
}

	
message School {
	map<string, Person.Teacher> teacherids = 1;
	map<int32, Person.Student> studentids = 2;
	map<int32, string> ids = 3;
	
	oneof test_oneof {
		string name = 5;
		string number = 6;
		string nikename = 7;
	}
}