[dependencies] # 依赖../protobuf/src和../google/src(第二级static), 不配置进workspace, 避免模块冲突
  protobuf = { path = "../protobuf/src"}
  google = { path = "../google/src"}

[package]
  cjc-version = "1.1.0"
  description = "protobuf compiler cangjie plugin"
  link-option = ""
  name = "protoc_gen_cj"
  output-type = "executable"
  compile-option = ""
  override-compile-option = "-O2"
  src-dir = "src"
  target-dir = ""
  version = "1.0.3"
  package-configuration = {}

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff unused --error-count-limit all "
    release = "--fast-math -O2 -Woff all"
  [profile.test]
