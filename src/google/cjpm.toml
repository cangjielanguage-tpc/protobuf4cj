[dependencies]
  protobuf = { path = "../protobuf"}
[package]
  cjc-version = "1.1.0"
  compile-option = ""
  description = "google.protobuf cj translation"
  link-option = ""
  name = "google"
  output-type = "static"
  override-compile-option = "-O2"
  src-dir = ""
  target-dir = "../../target"
  version = "1.0.3"
  package-configuration = {}

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff unused --error-count-limit all "
    release = "--fast-math -O2 -Woff all"
  [profile.test]
