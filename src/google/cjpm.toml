[dependencies]
  protobuf = { path = "../protobuf"}

[package] # 第一级: dynamic构建, 配置到workspace中, 供下游引用
  cjc-version = "1.1.0"
  description = "google.protobuf cj translation"
  link-option = ""
  name = "google"
  output-type = "dynamic"
  compile-option = ""
  override-compile-option = "-O2"
  src-dir = "src"
  target-dir = "../../target"
  version = "1.0.3"
  package-configuration = {}

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff unused --error-count-limit all "
    release = "--fast-math -O2 -Woff all"
  [profile.test]
